<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Document</title>
    </head>
    <body>
        <article class="gallery-item">
            <h1 class="gallery-item__title">My first header section</h1>
            <p>This header has a green 3px border that is dashed</p>
            <p class="gallery-item__para">I'm a blue line through paragraph</p>
        </article>

        <article class="gallery-item gallery-item--secondary">
            <h1 class="gallery-item__title gallery-item__title--center">
                I'm in the center
            </h1>
            <p>This header section has a coral 2px border that is solid</p>
            <p class="gallery-item__para gallery-item__para--right">
                I'm a blue line through paragraph, I'm also aligned to the right
            </p>
        </article>
    </body>
</html>
